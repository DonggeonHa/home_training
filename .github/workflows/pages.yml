name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Security audit
        run: pnpm audit:security
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium chrome
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration coverage
        run: pnpm test:coverage
      - name: Domain and storage coverage
        run: pnpm test:domain-storage-coverage
      - name: Catalog coverage
        run: pnpm test:catalog-coverage
      - name: Build
        run: pnpm build
      - name: Audit preview lifecycle
        run: node --test scripts/audit/preview-lifecycle.node-test.mjs scripts/audit/lighthouse-real-chrome.node-test.mjs
      - name: Playwright Chromium
        run: pnpm exec playwright test --project=chromium
      - name: Todo11 visual harness
        run: pnpm exec playwright test -c src/features/dashboard/todo11-playwright.config.ts --project=chromium
      - name: React Doctor performance gate
        run: pnpm audit:react-doctor
      - name: React Scan runtime gate
        run: pnpm audit:react-scan
      - name: Lighthouse real Chrome gate
        run: pnpm audit:lighthouse
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
  verify-deployment:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chrome
        run: pnpm exec playwright install --with-deps chrome
      - name: Deployed Lighthouse real Chrome gate
        run: pnpm audit:lighthouse --url "$DEPLOYED_URL"
      - name: Upload deployed Lighthouse artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployed-lighthouse
          path: .omo/evidence/home-training/task-12/lighthouse
          if-no-files-found: ignore
