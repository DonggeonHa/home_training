name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Security audit
        run: pnpm audit:security
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium chrome
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration coverage
        run: pnpm test:coverage
      - name: Domain and storage coverage
        run: pnpm test:domain-storage-coverage
      - name: Catalog coverage
        run: pnpm test:catalog-coverage
      - name: Build
        run: pnpm build
      - name: Audit preview lifecycle
        run: node --test scripts/audit/preview-lifecycle.node-test.mjs
      - name: Playwright Chromium
        run: pnpm exec playwright test --project=chromium
      - name: Todo11 visual harness
        run: pnpm exec playwright test -c src/features/dashboard/todo11-playwright.config.ts --project=chromium
      - name: React Doctor performance gate
        run: pnpm audit:react-doctor
      - name: React Scan runtime gate
        run: pnpm audit:react-scan
      - name: Lighthouse real Chrome gate
        run: pnpm audit:lighthouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qa-evidence
          path: |
            .omo/evidence/home-training/task-11/
            .omo/evidence/home-training/task-12/
            test-results/
            playwright-report/
          if-no-files-found: ignore
